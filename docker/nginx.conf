# ═══════════════════════════════════════════════════════════════
#  Nginx — Proxy reverso para o Portal de Manutenção
# ═══════════════════════════════════════════════════════════════

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    # Gzip
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml image/svg+xml;

    # Limite de upload (fotos até 12MB com margem)
    client_max_body_size 12M;

    # Esconde versão do Nginx
    server_tokens off;

    # Upstream para a API Node.js
    upstream portal_api {
        server app:3001;
        keepalive 32;
    }

    # ── HTTP → HTTPS (produção) ──────────────────────────────
    # Descomente quando tiver SSL configurado
    # server {
    #     listen 80;
    #     server_name seudominio.com.br;
    #     location /.well-known/acme-challenge/ { root /var/www/certbot; }
    #     location / { return 301 https://$host$request_uri; }
    # }

    # ── Servidor principal ───────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options           "SAMEORIGIN"            always;
        add_header X-Content-Type-Options    "nosniff"               always;
        add_header X-XSS-Protection          "1; mode=block"         always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=()" always;

        # ── API ──────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://portal_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade          $http_upgrade;
            proxy_set_header   Connection       'upgrade';
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ── Uploads (storage local) ──────────────────────────
        location /uploads/ {
            proxy_pass         http://portal_api;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_cache_bypass $http_upgrade;
            # Cache de imagens (7 dias)
            proxy_cache_valid  200 7d;
            expires            7d;
            add_header         Cache-Control "public, immutable";
        }

        # ── Health check (bypass de rate limit) ─────────────
        location /health {
            proxy_pass http://portal_api;
            access_log off;
        }

        # ── Frontend (SPA) ───────────────────────────────────
        # Encaminha todo o resto para a API (que serve o React em produção)
        location / {
            proxy_pass         http://portal_api;
            proxy_http_version 1.1;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ── HTTPS (SSL — descomente quando tiver certificado) ────
    # server {
    #     listen 443 ssl http2;
    #     server_name seudominio.com.br;
    #
    #     ssl_certificate     /etc/letsencrypt/live/seudominio.com.br/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/seudominio.com.br/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     ssl_stapling        on;
    #     ssl_stapling_verify on;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     # ... demais locations iguais ao servidor HTTP
    # }
}
