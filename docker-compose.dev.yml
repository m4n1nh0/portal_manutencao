# docker-compose.dev.yml - override para desenvolvimento
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Ou:  npm run docker:dev

services:
  mysql:
    # Expoe o banco para ferramentas externas (DBeaver, TablePlus, etc.).
    ports:
      - "3306:3306"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Usa apenas as dependencias do backend, sem build do frontend.
      target: backend-deps
    working_dir: /app/backend
    environment:
      NODE_ENV:       development
      PORT:           3001
      SERVE_CLIENT:   "false"
      FRONTEND_URL:   http://localhost:5173
      CLIENT_URL:     http://localhost:5173
      DB_HOST:        mysql
      DB_PORT:        3306
      DB_USER:        root
      DB_PASSWORD:    root123
      DB_NAME:        portal_manutencao
      JWT_SECRET:     dev_docker_change_me_64_chars_minimum_portal_local_secret
      RUN_SEEDS:      "true"
      STORAGE_DRIVER: local
      UPLOAD_DIR:     /app/uploads
      LOG_LEVEL:      debug
      LOG_FORMAT:     text
      LOG_HTTP_REQUESTS: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Hot reload: monta o codigo local.
      - ./backend/src:/app/backend/src:ro
      - ./backend/scripts:/app/backend/scripts:ro
      - ./database:/app/database:ro
      # Uploads persistentes no host para inspecionar.
      - ./uploads_dev:/app/uploads
    command: ["sh", "-c", "node scripts/migrate.js && if [ \"$$RUN_SEEDS\" = \"true\" ]; then node scripts/seed.js; fi && ./node_modules/.bin/nodemon --legacy-watch src/server.js"]
    depends_on:
      mysql:
        condition: service_healthy
    # Expoe diretamente no dev (sem Nginx na frente).
    ports:
      - "3001:3001"

  frontend:
    # Servico adicional: Vite dev server com HMR.
    image: node:20-alpine
    container_name: portal_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    command: sh -c "npm install --no-package-lock && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_PROXY_TARGET: http://app:3001
    depends_on:
      - app

volumes:
  frontend_modules:
