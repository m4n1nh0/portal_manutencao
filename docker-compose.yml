x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ─── MySQL 8 ──────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    logging: *default-logging
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE:      portal_manutencao
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot123 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Monolito (API + React no mesmo container) ────────────────
  portal-monolith:
    profiles: ["monolith"]
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV:        production
      PORT:            3001
      SERVE_CLIENT:    "true"
      CLIENT_DIST_DIR: /app/client/dist
      DB_HOST:         mysql
      DB_PORT:         3306
      DB_USER:         root
      DB_PASSWORD:     root123
      DB_NAME:         portal_manutencao
      JWT_SECRET:      dev_monolith_change_me_64_chars_minimum_portal_local_secret
      CLIENT_URL:      http://localhost:3001
      APP_URL:         http://localhost:3001
      # ── Multi-tenant ──
      # Em localhost nao ha subdominio real, entao o fallback fica ligado.
      # Em producao: APP_DOMAIN=seudominio.com.br e TENANT_FALLBACK=false.
      APP_DOMAIN:      ${APP_DOMAIN:-localhost}
      APP_PROTOCOL:    ${APP_PROTOCOL:-http}
      APP_PORT_PUBLICA: ${APP_PORT_PUBLICA:-3001}
      PROVIDER_SUBDOMAIN: ${PROVIDER_SUBDOMAIN:-admin,painel}
      TENANT_HOSTS:    ${TENANT_HOSTS:-}
      TENANT_FALLBACK: ${TENANT_FALLBACK:-true}
      TENANT_DEFAULT_SLUG: ${TENANT_DEFAULT_SLUG:-principal}
      TRIAL_DIAS:      ${TRIAL_DIAS:-14}
      SUSPENSAO_APOS_DIAS: ${SUSPENSAO_APOS_DIAS:-30}
      IMPERSONACAO_MINUTOS: ${IMPERSONACAO_MINUTOS:-60}
      SUPERADMIN_LOGIN: ${SUPERADMIN_LOGIN:-provedor}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-provedor@portal.local}
      SUPERADMIN_SENHA: ${SUPERADMIN_SENHA:-Provedor@123}
      RUN_MIGRATIONS:  "true"
      RUN_SEEDS:       "false"
      STORAGE_DRIVER:  local
      UPLOAD_DIR:      /app/uploads
      LOG_DIR:         /app/logs
      LOG_LEVEL:       info
      LOG_FORMAT:      text
      WAIT_FOR_DB:     "true"
      DB_WAIT_TIMEOUT_SECONDS: 60
      SMTP_HOST:       ""
      SMTP_USER:       ""
      SMTP_PASS:       ""
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads

  # ─── API separada ─────────────────────────────────────────────
  api:
    profiles: ["split"]
    logging: *default-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV:       production
      PORT:           3001
      SERVE_CLIENT:   "false"
      DB_HOST:        mysql
      DB_PORT:        3306
      DB_USER:        root
      DB_PASSWORD:    root123
      DB_NAME:        portal_manutencao
      JWT_SECRET:     dev_split_change_me_64_chars_minimum_portal_local_secret
      CLIENT_URL:     http://localhost:8080
      APP_URL:        http://localhost:3001
      # ── Multi-tenant (ver comentario no servico "app") ──
      APP_DOMAIN:     ${APP_DOMAIN:-localhost}
      APP_PROTOCOL:   ${APP_PROTOCOL:-http}
      APP_PORT_PUBLICA: ${APP_PORT_PUBLICA:-8080}
      PROVIDER_SUBDOMAIN: ${PROVIDER_SUBDOMAIN:-admin,painel}
      TENANT_HOSTS:    ${TENANT_HOSTS:-}
      TENANT_FALLBACK: ${TENANT_FALLBACK:-true}
      TENANT_DEFAULT_SLUG: ${TENANT_DEFAULT_SLUG:-principal}
      TRIAL_DIAS:     ${TRIAL_DIAS:-14}
      SUSPENSAO_APOS_DIAS: ${SUSPENSAO_APOS_DIAS:-30}
      IMPERSONACAO_MINUTOS: ${IMPERSONACAO_MINUTOS:-60}
      SUPERADMIN_LOGIN: ${SUPERADMIN_LOGIN:-provedor}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-provedor@portal.local}
      SUPERADMIN_SENHA: ${SUPERADMIN_SENHA:-Provedor@123}
      RUN_MIGRATIONS: "true"
      RUN_SEEDS:      "false"
      STORAGE_DRIVER: local
      UPLOAD_DIR:     /app/uploads
      LOG_DIR:        /app/logs
      LOG_LEVEL:      info
      LOG_FORMAT:     text
      WAIT_FOR_DB:    "true"
      DB_WAIT_TIMEOUT_SECONDS: 60
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads

  # ─── Frontend separado (Caddy) ────────────────────────────────
  web:
    profiles: ["split"]
    logging: *default-logging
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3001/api
    environment:
      PORT: 8080
    depends_on:
      - api
    ports:
      - "8080:8080"

volumes:
  mysql_data:
